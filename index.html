    <script>
      if (location.protocol !== 'file:') {
        fetch('%BASE_URL%hdri/kloppenheim_06_puresky_2k.hdr').catch(function () {})
      }
    </script>

    style="margin: 0; overscroll-behavior: none; background-color: #23262a"
  >
    <!-- Dark backdrop: the first frame and the boot loading screen sit on this
         flat colour; the sky dome and sea fade in over it once they are ready. -->
    <div id="scene-container"></div>

  </body>
